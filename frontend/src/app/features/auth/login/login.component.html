<div class="auth-page-container">
  <mat-card class="auth-card">
    <mat-card-header class="auth-header">
      <div class="brand-logo">🎲</div>
      <mat-card-title>登入冒險者日誌</mat-card-title>
      <mat-card-subtitle>記錄您的每一次傳奇冒險與戰利品</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="auth-content">
      <!-- 錯誤提示 -->
      <div *ngIf="errorMessage()" class="auth-error-alert">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- 第三方快速登入 -->
      <div class="oauth-buttons">
        <button mat-stroked-button type="button" class="btn-oauth btn-google" (click)="loginWithGoogle()">
          <svg class="oauth-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          使用 Google 登入
        </button>

        <button mat-stroked-button type="button" class="btn-oauth btn-discord" (click)="loginWithDiscord()">
          <svg class="oauth-icon" viewBox="0 0 24 24" fill="#5865F2">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          使用 Discord 登入
        </button>
      </div>

      <div class="divider-with-text">
        <mat-divider></mat-divider>
        <span class="divider-label">或使用電子郵件</span>
        <mat-divider></mat-divider>
      </div>

      <!-- 帳密登入表單 -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>電子郵件 (Email)</mat-label>
          <input matInput type="email" formControlName="email" placeholder="example@domain.com" autocomplete="email" />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">請輸入電子郵件</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">請輸入正確的 Email 格式</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>密碼</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())" [attr.aria-label]="'切換密碼顯示'">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">請輸入密碼</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="btn-submit full-width" [disabled]="loginForm.invalid || isLoading()">
          <mat-spinner *ngIf="isLoading()" diameter="20" class="spinner"></mat-spinner>
          <span *ngIf="!isLoading()">登入</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="auth-footer">
      <span>還沒有冒險者帳號？</span>
      <a mat-button color="accent" routerLink="/register">立即註冊</a>
    </mat-card-actions>
  </mat-card>
</div>
