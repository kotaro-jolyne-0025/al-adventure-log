<div class="auth-page-container">
  <mat-card class="auth-card">
    <mat-card-header class="auth-header">
      <mat-card-title>忘記密碼</mat-card-title>
      <mat-card-subtitle>輸入您的註冊信箱以獲取重設密碼連結</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="auth-content">
      <!-- 錯誤提示 -->
      <div *ngIf="errorMessage()" class="auth-error-alert">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- 送出成功狀態卡片 -->
      @if (isSubmitted()) {
        <div class="success-state-container">
          <div class="success-icon-wrapper">
            <mat-icon class="success-icon">mark_email_read</mat-icon>
          </div>
          <h3 class="success-title">信件已寄出！</h3>
          <p class="success-desc">
            若 <strong>{{ submittedEmail() }}</strong> 存在於系統中，我們已發送重設密碼連結至您的電子信箱。
          </p>
          <div class="tip-box">
            <mat-icon>info</mat-icon>
            <span>重設連結在 <strong>15 分鐘</strong> 內有效。若未收到，請檢查垃圾郵件匣。</span>
          </div>
          <div class="actions-group">
            <a mat-raised-button color="primary" routerLink="/login" class="btn-back-login full-width">
              返回登入頁面
            </a>
            <button mat-button type="button" (click)="isSubmitted.set(false)" class="btn-resend">
              使用其他信箱重試
            </button>
          </div>
        </div>
      } @else {
        <!-- 忘記密碼表單 -->
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>電子郵件 (Email)</mat-label>
            <input matInput type="email" formControlName="email" placeholder="example@domain.com" autocomplete="email" />
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">請輸入電子郵件</mat-error>
            <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">請輸入正確的 Email 格式</mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" class="btn-submit full-width" [disabled]="forgotForm.invalid || isLoading()">
            <mat-spinner *ngIf="isLoading()" diameter="20" class="spinner"></mat-spinner>
            <span *ngIf="!isLoading()">發送重設密碼信件</span>
          </button>
        </form>
      }
    </mat-card-content>

    @if (!isSubmitted()) {
      <mat-card-actions class="auth-footer">
        <span>想起密碼了？</span>
        <a mat-button color="accent" routerLink="/login">返回登入</a>
      </mat-card-actions>
    }
  </mat-card>
</div>
