version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    # Remove when Angular compiler/build support TypeScript 7; tracked in #56.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      maven-security:
        applies-to: security-updates
        patterns: ["*"]
      maven-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
