name: Protect Flyway migrations

on:
  pull_request:

permissions:
  contents: read

jobs:
  immutable-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject edits to existing migrations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python .github/scripts/check_migrations.py --base "$BASE_SHA" --head "$HEAD_SHA"
