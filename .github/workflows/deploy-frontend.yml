name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    concurrency:
      group: production-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify matching production backend
        env:
          BACKEND_INFO_URL: https://dnd-adv-backend-837209916237.asia-east1.run.app/actuator/info
        run: |
          set -euo pipefail
          live_commit() {
            curl -fsS --max-time 10 "$BACKEND_INFO_URL" | jq -r '.deployment.commit // empty'
          }

          for attempt in {1..60}; do
            live="$(live_commit || true)"
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]] &&
              git cat-file -e "$live^{commit}" 2>/dev/null &&
              git merge-base --is-ancestor "$live" "$GITHUB_SHA" &&
              git diff --quiet "$live" "$GITHUB_SHA" -- backend/; then
              exit 0
            fi
            sleep 10
          done
          echo "Matching backend is unavailable; frontend deployment stopped." >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting

