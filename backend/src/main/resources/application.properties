# ==========================================
# D&D 冒險日誌系統 — Spring Boot 設定
# ==========================================

# 應用程式名稱
spring.application.name=dnd-adv-log-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# -------
# 資料庫連線（從環境變數讀取，本機開發請建立 application-local.properties）
# -------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------
# HikariCP 連線池最佳化 (相容 Supabase Pooler)
# -------
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# -------
# MyBatis
# -------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

# -------
# 伺服器設定
# -------
server.port=8080

# -------
# CORS 設定（從環境變數讀取，預設允許本機與 Zeabur 線上前端）
# -------
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200,https://adv-log.zeabur.app}


# -------
# JWT 設定
# -------
app.jwt.secret=${JWT_SECRET:dnd-adv-log-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-safety-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# -------
# OAuth 第三方設定
# -------
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.discord.client-id=${DISCORD_CLIENT_ID:}
app.oauth.discord.client-secret=${DISCORD_CLIENT_SECRET:}
app.oauth.discord.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:4200/auth/callback/discord}

# -------
# Flyway Migration 設定
# -------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration


