# ==========================================
# 冒險紀錄表Web版 — Spring Boot 設定
# ==========================================

# 應用程式名稱
spring.application.name=dndadvlog-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# -------
# 資料庫連線（正式環境由環境變數提供，本機由 LocalDevLauncher 注入暫存資料庫）
# -------
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------
# HikariCP 連線池設定 (Cloud Run / Supabase Pooler)
# -------
spring.datasource.hikari.maximum-pool-size=10
# Cloud Run 閒置時會限制 CPU；按需求補連線，避免背景 SSL 握手逾時。
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------
# MyBatis
# -------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

# -------
# 伺服器設定 (支援 Cloud Run 動態 PORT 環境變數)
# -------
server.port=${PORT:8080}

# -------
# CORS 設定（從環境變數讀取，預設允許本機開發端點）
# -------
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}


# -------
# JWT 設定
# -------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# -------
# OAuth 第三方設定
# -------
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.discord.client-id=${DISCORD_CLIENT_ID:}
app.oauth.discord.client-secret=${DISCORD_CLIENT_SECRET:}
app.oauth.discord.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:4200/auth/callback/discord}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# -------
# 郵件發送設定 (選填，若未配置則以 Log 輸出重設連結)
# -------
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${APP_MAIL_FROM:onboarding@resend.dev}

# -------
# Flyway Migration 設定
# -------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration


